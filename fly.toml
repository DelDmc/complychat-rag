# Written by hand rather than generated by `fly launch`, so that every value
# here is a deliberate choice rather than a default nobody read.
#
# `app` is globally unique across all of Fly. If `fly deploy` reports the name
# is taken, the new hostname has to be changed in THREE places, not two:
#   1. `app` on the line below
#   2. DJANGO_ALLOWED_HOSTS in [env]
#   3. the pinned Host header in [http_service.checks.headers]
# Missing (3) is the quiet one: the probe would keep sending the old hostname,
# Django would reject it with a 400, and Fly would restart a machine that is
# perfectly healthy — the exact loop that pinned header exists to prevent.
app = "complychat"

# Singapore is the nearest region to where this is operated from, and a fair
# middle for UK reviewers.
primary_region = "sin"

[build]

[env]
  # Non-secret configuration lives here; SECRET_KEY and OPENAI_API_KEY are set
  # with `fly secrets set` and never appear in this file.
  PORT = "8000"

  # Two gunicorn workers. Each loads chromadb, onnxruntime and its own copy of
  # the Chroma index, so worker count — not traffic — sets the memory ceiling
  # in the [[vm]] block below.
  WEB_CONCURRENCY = "2"

  # settings.py splits on commas and strips whitespace. localhost and 127.0.0.1
  # are here for the health check, which connects to the machine directly and
  # does not necessarily present the public hostname as its Host header.
  DJANGO_ALLOWED_HOSTS = "complychat.fly.dev, localhost, 127.0.0.1"

  # DEBUG is deliberately absent. settings.py defaults it to off, so a variable
  # nobody sets fails safe. Setting it to "0" here would work but would also
  # invite someone to flip it to "1" on a public host.

[http_service]
  internal_port = 8000
  force_https = true

  # Suspend on idle rather than stay always-on. This is a demo link that is
  # clicked occasionally, so paying for a machine to sit idle is the wrong
  # trade — but a cold boot is also wrong, because it re-imports chromadb and
  # onnxruntime and rebuilds the chain before the first request can be served
  # (measured locally: ~3s and ~164MB RSS per worker against an empty index;
  # slower on a shared CPU with the real index baked in).
  #
  # "suspend" snapshots the machine's memory instead of stopping it, so a
  # resume skips that import cost entirely. That is the whole reason to prefer
  # it over "stop" here.
  auto_stop_machines = "suspend"
  auto_start_machines = true

  # Must be 0, and this is load-bearing. min_machines_running only applies when
  # autostop is enabled, and a value of 1 pins one machine in the running state
  # — which would mean it never suspends and the setting above does nothing.
  min_machines_running = 0

  # /healthz touches neither the chain nor the vector store, so it keeps
  # answering while the corpus is missing or the LLM is rate-limited. A check
  # that called the model would restart a machine that is merely degraded.
  #
  # These run against machines that are awake; a suspended machine is resumed
  # by an incoming request, not by the health check.
  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

    # Belt and braces with the localhost entries above: pin the Host header so
    # Django's ALLOWED_HOSTS check cannot 400 the health check and trigger a
    # restart loop on a machine that is actually healthy.
    [http_service.checks.headers]
      Host = "complychat.fly.dev"

[[vm]]
  size = "shared-cpu-1x"
  # 1GB, not the 256MB default: two workers each holding chromadb, onnxruntime
  # and an index will not fit in 256MB. Measured at 164MB per worker against an
  # empty index, so this has headroom; revisit once the real index is baked,
  # since memory is the main cost driver.
  memory = "1gb"
